name: Malaria Multi-Modal CI
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install -r requirements.txt
    - run: python run_pipeline.py
    - run: python -c "import pandas as pd; u=pd.read_csv('outputs/tables/unified_candidates.csv'); assert len(u)==35; print('✓ Validated')"
